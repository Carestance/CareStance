{% extends "base.html" %}

{% block title %}Career Buddy — Voice Companion{% endblock %}

{% block extra_head %}
<style>
    body {
        background: url('/static/images/BG1.png') center top / cover no-repeat fixed !important;
        padding-top: 0 !important;
    }
    
    /* Animation for idle state */
    @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
    }
    
    .avatar-idle {
        animation: float 6s ease-in-out infinite;
    }
    
    /* Animation for voice ring */
    @keyframes pulse-ring {
        0% { transform: scale(0.9); opacity: 0; }
        50% { transform: scale(1.2); opacity: 0.3; }
        100% { transform: scale(1.5); opacity: 0; }
    }
    
    .ring-listening {
        background-color: #10b981; /* Emerald 500 */
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .ring-thinking {
        background: conic-gradient(from 0deg, transparent, #10b981, transparent);
        animation: spin 2s linear infinite;
        border-radius: 50%;
    }
    
    @keyframes spin {
        100% { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="h-screen w-full flex flex-col pt-20">
    <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col items-center justify-center p-6 relative">
        
        <!-- Header Text -->
        <div class="text-center mb-10 animate-fade-in-up">
            <h1 class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Career Buddy</h1>
            <p class="text-emerald-600 font-bold tracking-widest uppercase text-sm">Your AI Career Companion</p>
        </div>

        <!-- Conversation Status -->
        <h2 id="conversation-status" class="text-xl md:text-2xl font-bold text-slate-500 mb-12 tracking-wide transition-all h-8">
            Ready when you are
        </h2>
        
        <!-- Center Avatar Area -->
        <div class="relative flex items-center justify-center mb-16 w-[280px] h-[280px] md:w-[360px] md:h-[360px]">
            <!-- Dynamic Ring -->
            <div id="voice-ring" class="absolute inset-0 rounded-full transition-all duration-300 pointer-events-none scale-100 opacity-0"></div>
            
            <!-- Avatar Container -->
            <div id="careo-container" class="relative z-10 w-full h-full rounded-full overflow-hidden shadow-2xl border-4 border-white bg-white transition-all duration-300 avatar-idle group">
                <video id="careo-img" src="/static/images/mascot.mp4" autoplay loop muted playsinline class="w-full h-full object-cover transition-transform duration-100"></video>
                
                <!-- Thinking Overlay (Optional Glow) -->
                <div id="thinking-glow" class="absolute inset-0 bg-emerald-500/20 mix-blend-overlay opacity-0 transition-opacity duration-500 pointer-events-none"></div>
            </div>
        </div>

        <!-- Live Captions -->
        <div class="h-16 w-full max-w-2xl mb-8 flex items-center justify-center">
            <div id="live-caption" class="text-center text-slate-700 text-lg md:text-xl font-medium transition-opacity duration-300 opacity-0 px-4 py-2 bg-white/60 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 hidden">
            </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-6 z-20">
            <!-- Optional Captions Toggle -->
            <button id="captions-btn" onclick="toggleCaptions()" class="w-12 h-12 rounded-full bg-white/80 text-slate-500 hover:bg-white font-bold text-xs shadow-md border border-slate-200 transition-all flex flex-col items-center justify-center" title="Toggle Captions">
                CC
            </button>
            
            <!-- Mic / Action Button -->
            <button id="mic-btn" onclick="toggleVoiceSession()" class="w-20 h-20 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white shadow-xl shadow-emerald-200 flex items-center justify-center text-3xl transition-all transform hover:scale-105 active:scale-95" title="Start Conversation">
                🎙️
            </button>
            
            <!-- End Conversation -->
            <button id="end-btn" onclick="finishAssessment()" class="w-12 h-12 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-100 shadow-md border border-rose-200 transition-all flex items-center justify-center hidden" title="End Conversation">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- Footer Branding -->
        <p class="absolute bottom-6 text-xs text-slate-400 font-medium">Powered by CareStance AI</p>

    </div>
</div>

<script src="/static/js/marked.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatBox = document.getElementById('chat-box');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const transcriptDisplay = document.getElementById('transcript-display');
        const timerSidebar = document.getElementById('timer-sidebar');
        const timerProgressSidebar = document.getElementById('timer-progress-sidebar');
        const finishBtn = document.getElementById('finishBtn');
        const mentorStatusSidebar = document.getElementById('mentor-status-text-sidebar');
        const sessionOverlay = document.getElementById('session-overlay');
        const startSessionBtn = document.getElementById('start-session-btn');

        let chatHistory = {{ (result.chat_messages if result.chat_messages else []) | tojson | safe }};
        if (!Array.isArray(chatHistory)) chatHistory = [];
        
        function renderHistoricalMessages() {
            chatBox.innerHTML = '';
            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                if (msg.role === 'assistant') {
                    div.className = 'flex items-start gap-3 animate-fade-in-up';
                    div.innerHTML = `
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-emerald-800 to-green-900 flex items-center justify-center flex-shrink-0 shadow-lg shadow-green-200">
                            <span class="text-sm sm:text-lg text-white">🤖</span>
                        </div>
                        <div class="bg-white text-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%]">
                            <div class="prose prose-emerald prose-sm max-w-none leading-relaxed">${renderMentorText(msg.content)}</div>
                        </div>
                    `;
                } else if (msg.role === 'user') {
                    div.className = 'flex items-start gap-3 flex-row-reverse animate-fade-in-up';
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center flex-shrink-0 shadow-sm">
                            <span class="text-sm">🗣️</span>
                        </div>
                        <div class="bg-emerald-50 text-emerald-900 px-4 py-3 rounded-2xl rounded-tr-none shadow-sm border border-emerald-100 max-w-[75%]">
                            <p class="text-sm italic">${msg.content}</p>
                        </div>
                    `;
                }
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        let timeLeft = 600;
        let timerInterval;
        let conversationDone = false;
        let isProcessing = false;

        function renderMentorText(text) {
            const safeText = String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return window.marked && typeof window.marked.parse === 'function'
                ? window.marked.parse(safeText)
                : safeText.replace(/\n/g, '<br>');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            if (timerSidebar) timerSidebar.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
            if (timerProgressSidebar) timerProgressSidebar.style.width = `${(timeLeft / 600) * 100}%`;
        }

    function updateCaption(text) {
        if (!text) {
            liveCaption.style.opacity = '0';
            return;
        }
        liveCaption.innerText = text;
        liveCaption.style.opacity = '1';
    }

    function setUIState(state) {
        currentUIState = state;
        
        // Reset base classes
        careoContainer.className = 'relative z-10 w-full h-full rounded-full overflow-hidden shadow-2xl border-4 border-white bg-white transition-all duration-300 group';
        voiceRing.className = 'absolute inset-0 rounded-full transition-all duration-300 pointer-events-none';
        thinkingGlow.style.opacity = '0';
        
        // Stop audio analysis if not speaking
        if (state !== 'AI_SPEAKING') {
            isSpeakingActive = false;
            careoImg.style.transform = 'scale(1)';
        }

        function appendMentorMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex items-start gap-3 animate-fade-in-up';
            div.innerHTML = `
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-emerald-800 to-green-900 flex items-center justify-center flex-shrink-0 shadow-lg shadow-green-200">
                    <span class="text-sm sm:text-lg text-white">🤖</span>
                </div>
                <div class="bg-white text-slate-700 p-4 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%]">
                    <div class="prose prose-emerald prose-sm max-w-none leading-relaxed">${renderMentorText(text)}</div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            chatHistory.push({ role: "assistant", content: text });
            
            const userMsgCount = chatHistory.filter(m => m.role === 'user').length;
            if (userMsgCount >= 3 && finishBtn) {
                finishBtn.classList.remove('hidden');
            }
        }
    }

    // Audio Analysis for Lip Sync
    function setupAudioAnalysis() {
        if (!window.voiceClient || !window.voiceClient.remoteAudio.srcObject) {
            // Fallback animation if Web Audio API can't connect
            fakeLipSync();
            return;
        }
        
        if (!audioCtx) {
            try {
                const resp = await fetch('/assessment/phase3/chat_v2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMsg, answers: chatHistory })
                });
                const raw = await resp.text();
                let data = {};
                try { data = raw ? JSON.parse(raw) : {}; } catch (_) { throw new Error('Career Talk returned an invalid response. Please try again.'); }
                if (!resp.ok) throw new Error(data.detail || 'Career Talk is unavailable right now. Please try again.');
                if (!data.response) throw new Error('Career Talk did not return a response. Please try again.');
                appendMentorMessage(data.response);
                if (data.recommendation_ready && finishBtn) {
                    finishBtn.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Chat error:", err);
                appendMentorMessage("I'm right here. Tell me a bit more about what interests you most!");
            } finally {
                isProcessing = false;
                setMentorStatus('IDLE');
            }
        }
        
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        
        analyzeAudio();
    }

    function analyzeAudio() {
        if (!isSpeakingActive) {
            // Cleanup
            voiceRing.style.opacity = '0';
            voiceRing.style.transform = 'scale(1)';
            careoImg.style.transform = 'scale(1)';
            return;
        }
        
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        // Average the lower frequencies (speech energy)
        const limit = Math.min(dataArray.length, 64);
        for (let i = 0; i < limit; i++) {
            sum += dataArray[i];
        }
        const average = sum / limit;
        const audioLevel = average / 255; // 0 to 1
        
        // When AI stops talking (silence), audioLevel drops to ~0.
        // We can detect end of speech if silence persists, but for now we just react.
        
        // Apply smoothed transform to the mascot image to simulate speaking / breathing
        const scale = 1 + (audioLevel * 0.15); // Max scale 1.15
        careoImg.style.transform = `scale(${scale})`;
        
        // React the ring as well
        voiceRing.style.opacity = Math.max(0.1, audioLevel * 0.5).toString();
        voiceRing.style.transform = `scale(${1 + audioLevel * 0.4})`;
        
        animationFrame = requestAnimationFrame(analyzeAudio);
    }
    
    // Fallback if audio context fails
    function fakeLipSync() {
        if (!isSpeakingActive) return;
        const randomScale = 1 + (Math.random() * 0.1);
        careoImg.style.transform = `scale(${randomScale})`;
        voiceRing.style.opacity = '0.3';
        voiceRing.style.transform = `scale(${1 + Math.random() * 0.2})`;
        setTimeout(fakeLipSync, 100);
    }

    // Pipecat Integration
    function toggleVoiceSession() {
        if (currentUIState === 'IDLE' || currentUIState === 'ERROR' || currentUIState === 'DISCONNECTED') {
            startSession();
        } else {
            // Manually stop
            if (window.voiceClient) {
                window.voiceClient.disconnect();
            }
        }
    }

    function startSession() {
        setUIState('CONNECTING');
        updateCaption('Connecting to AI...');
        
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/api/webrtc/offer`;
        
        window.voiceClient = new VoiceClient(wsUrl, (state) => {
            // Map VoiceClient states to our UI
            if (state === 'LISTENING') setUIState('LISTENING');
            else if (state === 'ERROR') setUIState('ERROR');
            else if (state === 'DISCONNECTED') setUIState('IDLE');
        }, (msg) => {
            if (!msg || !msg.type) return;

            if (msg.type === 'TRANSCRIPT_PARTIAL') {
                setUIState('USER_SPEAKING');
                updateCaption(msg.text);
            } else if (msg.type === 'TRANSCRIPT_FINAL') {
                setUIState('THINKING');
                updateCaption(msg.text);
                chatHistory.push({ role: 'user', content: msg.text });
            } else if (msg.type === 'ASSISTANT_MESSAGE') {
                setUIState('AI_SPEAKING');
                updateCaption(msg.text);
                chatHistory.push({ role: 'assistant', content: msg.text });
            } else if (msg.type === 'CONVERSATION_COMPLETED') {
                // Keep the end button prominent
                endBtn.classList.remove('hidden');
                endBtn.classList.add('bg-emerald-500', 'text-white');
            }
        });
        
        // Overwrite peer connection creation to ensure we catch audio track properly
        // Note: voiceClient internally sets this.remoteAudio.srcObject.
        // We can just rely on setupAudioAnalysis finding it.
        
        // Listen for when AI audio stops (interruption or finished speaking)
        // Since we don't have a reliable AI_SILENCE event from pipecat via WebRTC text channel natively,
        // we can assume if state changes back to LISTENING, speaking is done.
        
        window.voiceClient.connect();
    }
    
    // Fix: We need to transition back to LISTENING when the AI finishes speaking.
    // In WebRTC, the data channel doesn't always send an "I finished speaking" event.
    // However, if we do audio analysis, we can detect silence.
    setInterval(() => {
        if (currentUIState === 'AI_SPEAKING' && analyser && dataArray) {
            // Quick check if silent
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
            if (sum === 0) {
                // Silent
                setTimeout(() => {
                    // Check again after 1 sec to ensure it wasn't just a pause
                    if (currentUIState === 'AI_SPEAKING') {
                        analyser.getByteFrequencyData(dataArray);
                        let sum2 = 0;
                        for(let i=0; i<dataArray.length; i++) sum2 += dataArray[i];
                        if (sum2 === 0) {
                            setUIState('LISTENING');
                        }
                    }
                }, 1000);
            }
        }
    }, 500);

    async function finishAssessment() {
        endBtn.disabled = true;
        endBtn.innerHTML = '⏳';
        
        if (window.voiceClient) {
            window.voiceClient.disconnect();
        }
        
        try {
            const resp = await fetch('/assessment/phase3/finalize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ history: chatHistory })
            });
            
            if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

            const data = await resp.json();
            if (data.redirect) {
                window.location.href = data.redirect;
            } else {
                alert("Error: No redirect URL provided by server.");
                endBtn.disabled = false;
                endBtn.innerHTML = 'Finish';
            }
        } catch (e) {
            console.error(e);
            alert("Network error while finalizing. Please try again.");
            endBtn.disabled = false;
            endBtn.innerHTML = 'Finish';
        }
    }

    // Initialization
    setUIState('IDLE');
</script>
{% endblock %}
