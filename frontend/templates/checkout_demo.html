{% extends "base.html" %}

{% block title %}Razorpay Standard Web Checkout Demo{% endblock %}

{% block content %}
<style>
    .ckd-page {
        --ink: #f3f0fb;
        --paper: #120c22;
        --surface: #1e1735;
        --pink: #c084fc;
        --pink-soft: rgba(192, 132, 252, 0.14);
        --yellow: #f5a623;
        --yellow-soft: rgba(245, 166, 35, 0.18);
        --green: #2dd4bf;
        --green-soft: rgba(45, 212, 191, 0.14);
        --text-secondary: #c7c0dd;
        --text-muted: #8f87ab;
        --line: rgba(255, 255, 255, 0.08);

        position: relative;
        min-height: 100vh;
        background: url('/static/images/BG4.png') center top / cover no-repeat fixed;
        color: var(--ink);
        overflow: hidden;
    }
    .ckd-page::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(11,11,15,0.35) 0%, rgba(11,11,15,0.75) 45%, var(--paper) 85%);
        pointer-events: none;
    }
    .ckd-page > * { position: relative; z-index: 1; }

    .ckd-card { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6); }
    .ckd-icon { background: var(--green-soft); color: var(--green); }
    .ckd-title { color: var(--ink); }
    .ckd-subtext { color: var(--text-secondary); }
    .ckd-warn { border: 1px solid rgba(245,166,35,0.3); background: var(--yellow-soft); color: #f3d9a8; }
    .ckd-label { color: var(--text-muted); }
    .ckd-select { background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--ink); }
    .ckd-pay-btn { background: linear-gradient(120deg, var(--pink), var(--green)); color: #fff; box-shadow: 0 14px 28px -10px rgba(0,0,0,0.5); }
    .ckd-pay-btn:hover { filter: brightness(1.1); }

    .ckd-status-success { background: var(--green-soft); color: var(--green); border: 1px solid rgba(45,212,191,0.3); }
    .ckd-status-error { background: rgba(255,107,129,0.1); color: #ffb3c0; border: 1px solid rgba(255,107,129,0.3); }
</style>

<div class="ckd-page py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto ckd-card rounded-3xl p-8">
        <div class="text-center mb-8">
            <div class="ckd-icon w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fas fa-credit-card"></i>
            </div>
            <h1 class="ckd-title text-2xl font-black leading-tight">Razorpay Checkout Demo</h1>
            <p class="ckd-subtext text-xs font-medium mt-2">Test Standard Web Integration Endpoints</p>
        </div>

        {% if not razorpay_configured %}
        <div class="ckd-warn mb-6 p-4 rounded-2xl text-xs font-medium">
            <i class="fas fa-exclamation-triangle mr-1"></i> Razorpay keys are missing or invalid in <code>.env</code>.
        </div>
        {% endif %}

        <div id="status-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-medium"></div>

        <div class="space-y-4">
            <div>
                <label class="ckd-label block text-xs font-bold uppercase tracking-wider mb-1">Select Amount (INR)</label>
                <select id="amount-select" class="ckd-select w-full px-4 py-3 rounded-xl font-bold">
                    <option value="10">₹10.00 (Test Payment)</option>
                    <option value="50">₹50.00 (Standard Payment)</option>
                    <option value="100">₹100.00 (Premium Payment)</option>
                </select>
            </div>

            <button id="pay-btn" onclick="startRazorpayCheckout()"
                class="ckd-pay-btn w-full py-4 font-bold rounded-2xl transition hover:shadow-xl flex items-center justify-center gap-2">
                <i class="fas fa-lock"></i> Pay Now with Razorpay
            </button>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
async function startRazorpayCheckout() {
    const amountInr = parseFloat(document.getElementById('amount-select').value);
    const payBtn = document.getElementById('pay-btn');
    const statusBox = document.getElementById('status-box');
    
    payBtn.disabled = true;
    payBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Order...';
    statusBox.classList.add('hidden');

    try {
        // Step 1: Create Order on Backend
        const res = await fetch('/api/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: amountInr, currency: 'INR' })
        });

        const order = await res.json();
        if (!res.ok) {
            throw new Error(order.detail || 'Could not create payment order');
        }

        // Step 2: Open Razorpay Standard Checkout Modal
        const options = {
            "key": "{{ RAZORPAY_KEY_ID }}",
            "amount": order.amount,
            "currency": order.currency || "INR",
            "name": "CareStance",
            "description": "Standard Web Checkout Demo",
            "order_id": order.order_id || order.id,
            "handler": async function (response) {
                // Step 3: Verify Payment Signature on Backend
                payBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Verifying Payment...';
                
                try {
                    const verifyRes = await fetch('/api/verify-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    });

                    const verifyData = await verifyRes.json();

                    if (verifyRes.ok && verifyData.status === 'success') {
                        statusBox.className = "mb-6 p-4 rounded-2xl text-xs font-bold ckd-status-success";
                        statusBox.innerHTML = `✅ Payment Verified Successfully!<br>Payment ID: ${response.razorpay_payment_id}`;
                        statusBox.classList.remove('hidden');
                    } else {
                        throw new Error(verifyData.detail || 'Payment verification failed.');
                    }
                } catch (vErr) {
                    statusBox.className = "mb-6 p-4 rounded-2xl text-xs font-bold ckd-status-error";
                    statusBox.textContent = `❌ Verification Error: ${vErr.message}`;
                    statusBox.classList.remove('hidden');
                } finally {
                    payBtn.disabled = false;
                    payBtn.innerHTML = '<i class="fas fa-lock mr-2"></i> Pay Now with Razorpay';
                }
            },
            "modal": {
                "ondismiss": function() {
                    payBtn.disabled = false;
                    payBtn.innerHTML = '<i class="fas fa-lock mr-2"></i> Pay Now with Razorpay';
                }
            },
            "theme": { "color": "#c084fc" }
        };

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function(resp) {
            statusBox.className = "mb-6 p-4 rounded-2xl text-xs font-bold ckd-status-error";
            statusBox.textContent = `❌ Payment Failed: ${resp.error.description || 'Transaction cancelled or failed.'}`;
            statusBox.classList.remove('hidden');
            payBtn.disabled = false;
            payBtn.innerHTML = '<i class="fas fa-lock mr-2"></i> Pay Now with Razorpay';
        });

        rzp.open();
    } catch (err) {
        statusBox.className = "mb-6 p-4 rounded-2xl text-xs font-bold ckd-status-error";
        statusBox.textContent = `❌ Error: ${err.message}`;
        statusBox.classList.remove('hidden');
        payBtn.disabled = false;
        payBtn.innerHTML = '<i class="fas fa-lock mr-2"></i> Pay Now with Razorpay';
    }
}
</script>
{% endblock %}
