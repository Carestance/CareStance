{% extends "base.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">

    <div class="bg-white/70 backdrop-blur-xl shadow-2xl rounded-3xl p-8 border border-white/50">

        <h2 class="text-3xl font-extrabold text-slate-800 mb-4 text-center">
            Share Your Feedback
        </h2>

        <p class="text-center text-slate-500 mb-8">
            Your insights help us improve CareStance for everyone.
        </p>

        <form action="/feedback" method="POST" class="space-y-6">

            <!-- Rating -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wide mb-3">
                    How would you rate your experience?
                </label>

                <div
                    class="flex flex-wrap justify-center gap-6 bg-white/60 border border-slate-200 rounded-2xl p-6 shadow-sm">

                    <label class="flex flex-col items-center cursor-pointer group">
                        <input type="radio" name="rating" value="1" class="sr-only peer" required>
                        <span
                            class="text-4xl grayscale peer-checked:grayscale-0 peer-checked:scale-110 group-hover:scale-110 transition-all duration-200">
                            😢
                        </span>
                        <span class="mt-2 text-xs font-semibold text-slate-500 peer-checked:text-red-500">
                            Poor
                        </span>
                    </label>

                    <label class="flex flex-col items-center cursor-pointer group">
                        <input type="radio" name="rating" value="2" class="sr-only peer">
                        <span
                            class="text-4xl grayscale peer-checked:grayscale-0 peer-checked:scale-110 group-hover:scale-110 transition-all duration-200">
                            😕
                        </span>
                        <span class="mt-2 text-xs font-semibold text-slate-500 peer-checked:text-orange-500">
                            Fair
                        </span>
                    </label>

                    <label class="flex flex-col items-center cursor-pointer group">
                        <input type="radio" name="rating" value="3" class="sr-only peer">
                        <span
                            class="text-4xl grayscale peer-checked:grayscale-0 peer-checked:scale-110 group-hover:scale-110 transition-all duration-200">
                            😐
                        </span>
                        <span class="mt-2 text-xs font-semibold text-slate-500 peer-checked:text-yellow-500">
                            Good
                        </span>
                    </label>

                    <label class="flex flex-col items-center cursor-pointer group">
                        <input type="radio" name="rating" value="4" class="sr-only peer">
                        <span
                            class="text-4xl grayscale peer-checked:grayscale-0 peer-checked:scale-110 group-hover:scale-110 transition-all duration-200">
                            😊
                        </span>
                        <span class="mt-2 text-xs font-semibold text-slate-500 peer-checked:text-green-500">
                            Very Good
                        </span>
                    </label>

                    <label class="flex flex-col items-center cursor-pointer group">
                        <input type="radio" name="rating" value="5" class="sr-only peer">
                        <span
                            class="text-4xl grayscale peer-checked:grayscale-0 peer-checked:scale-110 group-hover:scale-110 transition-all duration-200">
                            🤩
                        </span>
                        <span class="mt-2 text-xs font-semibold text-slate-500 peer-checked:text-teal-600">
                            Excellent
                        </span>
                    </label>

                </div>
            </div>

            <!-- Feedback -->
            <div>
                <label for="content" class="block text-sm font-bold text-slate-700 uppercase tracking-wide mb-2">
                    What did you like or what can we improve?
                </label>

                <textarea id="content" name="content" rows="6" required
                    class="block w-full px-5 py-4 bg-white/60 border border-slate-200 rounded-2xl text-slate-900 focus:ring-4 focus:ring-teal-500/20 focus:border-teal-500 transition-all shadow-sm resize-none"
                    placeholder="Tell us about your experience..."></textarea>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-slate-900 to-teal-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-teal-500/20 hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all duration-200">

                Submit Feedback

            </button>

        </form>

    </div>

</div>
{% endblock %}
