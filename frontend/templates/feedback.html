{% extends "base.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}
<!-- ============================================================
     GAME-WORLD BACKGROUND: dusk sky (same navy family as result.html)
     + twinkling pixels + drifting 8-bit clouds + blocky grass/dirt
     terrain, fixed behind everything.
     ============================================================ -->
<div class="pixel-sky" aria-hidden="true"></div>
<div class="pixel-stars" aria-hidden="true"></div>
<div class="pixel-clouds" aria-hidden="true">
    <div class="pixel-cloud cloud-a"></div>
    <div class="pixel-cloud cloud-b"></div>
    <div class="pixel-cloud cloud-c"></div>
</div>
<div class="mc-terrain" aria-hidden="true">
    <div class="mc-grass"></div>
    <div class="mc-dirt"></div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
        --sky-top: #05050f;
        --sky-mid: #171142;
        --sky-horizon: #2c1f5c;
        --panel-bg: #1c1a3a;
        --panel-bg-2: #14122c;
        --ink: #05050d;
        --teal: #2dd4bf;
        --purple: #a78bfa;
        --gold: #fbbf24;
        --green: #4ade80;
        --red: #f87171;
        --text-primary: #f8fafc;
        --text-secondary: #a8aed0;
    }

    /* ---------- Sky ---------- */
    .pixel-sky {
        position: fixed;
        inset: 0;
        z-index: -3;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-horizon) 78%, #3a2a63 100%);
    }

    .pixel-stars {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
            radial-gradient(#fff 1px, transparent 1.5px),
            radial-gradient(#fff 1px, transparent 1.5px),
            radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1.5px);
        background-size: 70px 70px, 130px 130px, 45px 45px;
        background-position: 0 0, 35px 60px, 90px 20px;
        opacity: 0.45;
        animation: twinkle 3.5s ease-in-out infinite alternate;
    }
    @keyframes twinkle { 0% { opacity: 0.22; } 100% { opacity: 0.55; } }

    /* ---------- 8-bit clouds ---------- */
    .pixel-clouds { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
    .pixel-cloud {
        position: absolute;
        width: 8px; height: 8px;
        background: #eef4ff;
        opacity: 0.65;
        box-shadow:
            8px 0 0 0 #eef4ff, 16px 0 0 0 #eef4ff, 24px 0 0 0 #eef4ff, 32px 0 0 0 #eef4ff,
            0 8px 0 0 #eef4ff, 8px 8px 0 0 #eef4ff, 16px 8px 0 0 #eef4ff, 24px 8px 0 0 #eef4ff, 32px 8px 0 0 #eef4ff, 40px 8px 0 0 #eef4ff,
            8px -8px 0 0 #eef4ff, 16px -8px 0 0 #eef4ff, 24px -8px 0 0 #eef4ff;
    }
    .cloud-a { top: 12%; left: -80px; transform: scale(2); animation: driftA 55s linear infinite; }
    .cloud-b { top: 26%; left: -80px; transform: scale(1.3); opacity: 0.4; animation: driftB 80s linear infinite; }
    .cloud-c { top: 8%; left: -80px; transform: scale(1.6); opacity: 0.5; animation: driftC 68s linear infinite; }
    @keyframes driftA { from { transform: translateX(-10vw) scale(2); } to { transform: translateX(110vw) scale(2); } }
    @keyframes driftB { from { transform: translateX(-10vw) scale(1.3); } to { transform: translateX(115vw) scale(1.3); } }
    @keyframes driftC { from { transform: translateX(-10vw) scale(1.6); } to { transform: translateX(112vw) scale(1.6); } }

    /* ---------- Blocky grass + dirt ground ---------- */
    .mc-terrain { position: fixed; left: 0; right: 0; bottom: 0; z-index: -2; }
    .mc-grass {
        height: 22px;
        background: repeating-linear-gradient(90deg, #6abe30 0 16px, #58a726 16px 32px);
        position: relative;
    }
    .mc-grass::after {
        content: '';
        position: absolute;
        top: -8px; left: 0; right: 0; height: 8px;
        background: repeating-linear-gradient(90deg, #6abe30 0 8px, transparent 8px 16px);
    }
    .mc-dirt {
        height: 64px;
        background:
            repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 16px, transparent 16px 32px),
            repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 16px, transparent 16px 32px),
            #8b5a2b;
    }

    /* ---------- Layout ---------- */
    .fb-arena {
        position: relative;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        padding: clamp(2rem, 6vw, 4.5rem) 1rem 6rem;
        display: flex;
        justify-content: center;
    }

    .fb-quest {
        width: 100%;
        max-width: 640px;
        background: linear-gradient(165deg, var(--panel-bg) 0%, var(--panel-bg-2) 100%);
        padding: clamp(1.5rem, 4vw, 2.5rem);
        box-shadow:
            inset 4px 4px 0 0 rgba(255,255,255,0.10),
            inset -4px -4px 0 0 rgba(0,0,0,0.55),
            0 0 0 4px var(--ink),
            0 0 0 8px var(--teal),
            0 20px 0 -6px rgba(0,0,0,0.4);
    }

    .quest-eyebrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.1rem;
    }
    .quest-tag {
        font-family: 'Jersey 10', sans-serif;
        font-size: 1.15rem;
        letter-spacing: 0.12em;
        color: var(--gold);
        background: rgba(251, 191, 36, 0.12);
        border: 2px solid var(--gold);
        padding: 0.15rem 0.7rem;
    }
    .quest-reward {
        font-family: 'Jersey 10', sans-serif;
        font-size: 1.15rem;
        letter-spacing: 0.06em;
        color: var(--green);
        text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    .quest-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.6rem; }
    .quest-icon {
        width: 3.1rem; height: 3.1rem;
        display: flex; align-items: center; justify-content: center;
        color: var(--sky-top);
        font-size: 1.2rem;
        background: var(--teal);
        box-shadow:
            inset 3px 3px 0 0 rgba(255,255,255,0.5),
            inset -3px -3px 0 0 rgba(0,0,0,0.35),
            0 0 0 3px var(--ink);
        flex-shrink: 0;
    }
    .quest-title {
        font-family: 'Jersey 10', sans-serif;
        font-size: clamp(1.9rem, 5vw, 2.6rem);
        line-height: 1.05;
        letter-spacing: 0.03em;
        color: #fff;
        text-shadow: 3px 3px 0 var(--ink);
    }
    .quest-title .accent {
        color: var(--gold);
        text-shadow: 3px 3px 0 var(--ink), 0 0 14px rgba(251, 191, 36, 0.45);
    }
    .quest-desc {
        color: var(--text-secondary);
        font-size: 0.92rem;
        margin-bottom: 1.9rem;
        padding-left: 4.1rem;
    }

    .quest-form { display: flex; flex-direction: column; gap: 1.75rem; }

    .quest-label {
        display: block;
        font-family: 'Jersey 10', sans-serif;
        font-size: 1.05rem;
        letter-spacing: 0.1em;
        color: var(--purple);
        margin-bottom: 0.8rem;
        text-shadow: 2px 2px 0 var(--ink);
    }

    /* ---------- Rating: health-bar style pixel buttons ---------- */
    .hp-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.55rem;
    }
    .hp-option {
        position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
        padding: 0.75rem 0.3rem 0.6rem;
        background: var(--panel-bg-2);
        box-shadow:
            inset 3px 3px 0 0 rgba(255,255,255,0.08),
            inset -3px -3px 0 0 rgba(0,0,0,0.5),
            0 0 0 3px var(--ink);
        cursor: pointer;
        transition: transform 0.15s ease;
    }
    .hp-option:hover { transform: translateY(-3px); }
    .hp-emoji { font-size: 1.4rem; filter: grayscale(1) opacity(0.5); transition: filter 0.2s ease; }
    .hp-label {
        font-family: 'Jersey 10', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        color: #6f7396;
        text-align: center;
    }
    input.hp-radio { position: absolute; opacity: 0; pointer-events: none; }
    input.hp-radio:checked + .hp-emoji { filter: grayscale(0) opacity(1); transform: scale(1.15); }

    .hp-option:has(input.hp-radio:checked) {
        box-shadow:
            inset 3px 3px 0 0 rgba(0,0,0,0.55),
            inset -3px -3px 0 0 rgba(255,255,255,0.12),
            0 0 0 3px var(--ink);
    }
    .hp-option[data-level="1"]:has(input.hp-radio:checked) { background: rgba(248, 113, 113, 0.22); }
    .hp-option[data-level="1"]:has(input.hp-radio:checked) .hp-label { color: var(--red); }
    .hp-option[data-level="2"]:has(input.hp-radio:checked) { background: rgba(251, 146, 60, 0.22); }
    .hp-option[data-level="2"]:has(input.hp-radio:checked) .hp-label { color: #fb923c; }
    .hp-option[data-level="3"]:has(input.hp-radio:checked) { background: rgba(251, 191, 36, 0.22); }
    .hp-option[data-level="3"]:has(input.hp-radio:checked) .hp-label { color: var(--gold); }
    .hp-option[data-level="4"]:has(input.hp-radio:checked) { background: rgba(45, 212, 191, 0.22); }
    .hp-option[data-level="4"]:has(input.hp-radio:checked) .hp-label { color: var(--teal); }
    .hp-option[data-level="5"]:has(input.hp-radio:checked) { background: rgba(74, 222, 128, 0.22); }
    .hp-option[data-level="5"]:has(input.hp-radio:checked) .hp-label { color: var(--green); }

    /* ---------- Textarea: message scroll ---------- */
    .quest-textarea {
        width: 100%;
        padding: 1rem 1.1rem;
        background: var(--panel-bg-2);
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.94rem;
        border: none;
        outline: none;
        resize: none;
        box-shadow:
            inset 3px 3px 0 0 rgba(0,0,0,0.5),
            inset -3px -3px 0 0 rgba(255,255,255,0.06),
            0 0 0 3px var(--ink);
        transition: box-shadow 0.2s ease;
    }
    .quest-textarea::placeholder { color: #6f7396; }
    .quest-textarea:focus {
        box-shadow:
            inset 3px 3px 0 0 rgba(0,0,0,0.5),
            inset -3px -3px 0 0 rgba(255,255,255,0.06),
            0 0 0 3px var(--ink),
            0 0 0 6px var(--purple);
    }

    /* ---------- Submit: chunky game button ---------- */
    .quest-submit {
        width: 100%;
        display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        padding: 1.05rem;
        border: none;
        cursor: pointer;
        font-family: 'Jersey 10', sans-serif;
        font-size: 1.35rem;
        letter-spacing: 0.1em;
        color: var(--sky-top);
        background: var(--green);
        box-shadow:
            inset 4px 4px 0 0 rgba(255,255,255,0.55),
            inset -4px -4px 0 0 rgba(0,0,0,0.3),
            0 0 0 4px var(--ink),
            0 6px 0 4px #1c8f4a;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .quest-submit:hover { transform: translateY(-2px); }
    .quest-submit:active {
        transform: translateY(4px);
        box-shadow:
            inset 4px 4px 0 0 rgba(0,0,0,0.3),
            inset -4px -4px 0 0 rgba(255,255,255,0.2),
            0 0 0 4px var(--ink),
            0 2px 0 0 #1c8f4a;
    }

    @media (max-width: 480px) {
        .hp-row { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.35rem; }
        .hp-label { font-size: 0.7rem; }
        .quest-desc { padding-left: 0; }
        .quest-head { flex-direction: column; align-items: flex-start; }
    }
</style>

<div class="fb-arena">
    <div class="fb-quest">
        <div class="quest-eyebrow">
            <span class="quest-tag">SIDE QUEST</span>
            <span class="quest-reward">+10 XP</span>
        </div>

        <div class="quest-head">
            <div class="quest-icon"><i class="fas fa-comment-dots"></i></div>
            <h1 class="quest-title">SHARE YOUR<br><span class="accent">FEEDBACK</span></h1>
        </div>
        <p class="quest-desc">Your insights help us level up CareStance for everyone.</p>

        <form action="/feedback" method="POST" class="quest-form">
            <div>
                <label class="quest-label">RATE YOUR RUN</label>
                <div class="hp-row">
                    <label class="hp-option" data-level="1">
                        <input type="radio" name="rating" value="1" class="hp-radio" required>
                        <span class="hp-emoji">😢</span>
                        <span class="hp-label">Poor</span>
                    </label>
                    <label class="hp-option" data-level="2">
                        <input type="radio" name="rating" value="2" class="hp-radio">
                        <span class="hp-emoji">😕</span>
                        <span class="hp-label">Fair</span>
                    </label>
                    <label class="hp-option" data-level="3">
                        <input type="radio" name="rating" value="3" class="hp-radio">
                        <span class="hp-emoji">😐</span>
                        <span class="hp-label">Good</span>
                    </label>
                    <label class="hp-option" data-level="4">
                        <input type="radio" name="rating" value="4" class="hp-radio">
                        <span class="hp-emoji">😊</span>
                        <span class="hp-label">Great</span>
                    </label>
                    <label class="hp-option" data-level="5">
                        <input type="radio" name="rating" value="5" class="hp-radio">
                        <span class="hp-emoji">🤩</span>
                        <span class="hp-label">Epic</span>
                    </label>
                </div>
            </div>

            <div>
                <label for="content" class="quest-label">DROP YOUR MESSAGE</label>
                <textarea id="content" name="content" rows="5" required class="quest-textarea"
                    placeholder="Tell us about your experience..."></textarea>
            </div>

            <button type="submit" class="quest-submit">
                SUBMIT FEEDBACK <i class="fas fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
