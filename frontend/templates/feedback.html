{% extends "base.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}
<!-- GLOBAL ANIMATED BACKGROUND: teal/turquoise waves + floating glass bubbles, fixed behind all content (copied from landing.html) -->
<div class="site-bg" aria-hidden="true">
    <div class="site-bg-waves">
        <svg class="site-bg-wave wave-1" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,1400 L0,300 C150,250 220,420 320,480 C440,560 520,380 620,460 C700,520 760,700 800,780 L800,1400 Z" fill="#cdeeec" />
        </svg>
        <svg class="site-bg-wave wave-2" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,1400 L0,520 C120,460 200,620 300,640 C420,665 500,520 610,560 C700,592 760,760 800,860 L800,1400 Z" fill="#9fdcd8" />
        </svg>
        <svg class="site-bg-wave wave-3" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,1400 L0,760 C140,720 240,860 360,880 C480,900 560,780 660,820 C730,848 780,950 800,1020 L800,1400 Z" fill="#6fc1bd" />
        </svg>
    </div>
    <div class="site-bg-bubble b1"></div>
    <div class="site-bg-bubble b2"></div>
    <div class="site-bg-bubble b3"></div>
    <div class="site-bg-bubble b4"></div>
    <div class="site-bg-bubble b5"></div>
    <div class="site-bg-bubble b6"></div>
</div>

<style>
    /* ===================================================================
       GLOBAL ANIMATED BACKGROUND — copied 1:1 from landing.html: layered
       teal/turquoise wave SVGs + floating glass bubbles, fixed behind
       everything via position:fixed + z-index:-1 (so it always shows,
       even above/behind the navbar, regardless of any parent background).
       =================================================================== */
    .site-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        background: linear-gradient(160deg, #d7f3f1 0%, #bfe9e6 28%, #9ddcd9 55%, #6fc4c2 78%, #4fb0ae 100%);
    }

    .site-bg-waves {
        position: absolute;
        inset: -10% -10% -10% -10%;
        width: 120%;
        height: 120%;
    }

    .site-bg-wave {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .site-bg-wave.wave-1 { animation: bgDrift1 38s ease-in-out infinite; opacity: 0.55; }
    .site-bg-wave.wave-2 { animation: bgDrift2 46s ease-in-out infinite; opacity: 0.5; }
    .site-bg-wave.wave-3 { animation: bgDrift3 54s ease-in-out infinite; opacity: 0.4; }

    @keyframes bgDrift1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-2%, 2%) scale(1.04); } }
    @keyframes bgDrift2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(2.5%, -1.5%) scale(1.05); } }
    @keyframes bgDrift3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-1.5%, -2%) scale(1.03); } }

    /* Floating glassy bubbles, like the reference image */
    .site-bg-bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.85) 0%, rgba(102, 158, 167, 0.25) 35%, rgba(103, 211, 210, 0.383) 70%, transparent 100%);
        filter: blur(0.5px);
        will-change: transform;
    }

    .site-bg-bubble.b1 { width: 380px; height: 380px; top: -6%; right: 4%; animation: bubbleFloat1 24s ease-in-out infinite; }
    .site-bg-bubble.b2 {
        width: 220px; height: 220px; top: 18%; right: 22%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.9) 0%, rgba(56, 189, 248, 0.55) 40%, rgba(13, 148, 136, 0.2) 75%, transparent 100%);
        animation: bubbleFloat2 19s ease-in-out infinite;
    }
    .site-bg-bubble.b3 {
        width: 120px; height: 120px; top: 38%; right: 6%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(45, 212, 191, 0.6) 45%, transparent 100%);
        animation: bubbleFloat3 16s ease-in-out infinite;
    }
    .site-bg-bubble.b4 { width: 150px; height: 150px; top: 58%; left: 4%; animation: bubbleFloat2 21s ease-in-out infinite reverse; }
    .site-bg-bubble.b5 {
        width: 90px; height: 90px; top: 80%; left: 18%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.9) 0%, rgba(56, 189, 248, 0.5) 45%, transparent 100%);
        animation: bubbleFloat1 17s ease-in-out infinite reverse;
    }
    .site-bg-bubble.b6 { width: 260px; height: 260px; bottom: -8%; right: 12%; animation: bubbleFloat3 27s ease-in-out infinite; }

    @keyframes bubbleFloat1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-18px, 22px); } }
    @keyframes bubbleFloat2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(16px, -20px); } }
    @keyframes bubbleFloat3 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-14px, -16px); } }

    @media (max-width: 768px) {
        .site-bg-bubble.b1 { width: 220px; height: 220px; }
        .site-bg-bubble.b2 { width: 130px; height: 130px; }
        .site-bg-bubble.b6 { width: 160px; height: 160px; }
    }

    /* Self-contained, dependable CSS — avoids bracket-syntax Tailwind
       gradients (bg-gradient-to-r from-[var(--navy)] to-[var(--teal)]),
       which your build's purge step strips since it can't statically
       detect dynamic-looking arbitrary values. Real CSS below always ships. */

    .fb-page {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        position: relative;
        border-radius: 2rem;
        padding: clamp(1.5rem, 4vw, 3rem) 1rem;
    }

    .fb-card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #e7f3ee;
        border-radius: 1.5rem;
        overflow: hidden;
        box-shadow: 0 25px 55px -25px rgba(14, 42, 46, 0.35);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fb-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 32px 65px -25px rgba(14, 42, 46, 0.4);
    }

    .fb-header {
        position: relative;
        overflow: hidden;
        padding: 2.25rem 2rem;
        background: linear-gradient(120deg, #0E2A2E 0%, #14524E 55%, #0D9488 140%);
    }
    .fb-header::before {
        content: '';
        position: absolute;
        width: 220px; height: 220px;
        top: -80px; right: -60px;
        border-radius: 50%;
        filter: blur(45px);
        background: radial-gradient(circle, rgba(45, 212, 191, 0.45), transparent 70%);
    }
    .fb-header-icon {
        width: 3rem; height: 3rem; border-radius: 1rem;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 1.1rem;
        backdrop-filter: blur(6px);
    }

    .fb-rating-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.6rem;
    }
    .fb-rating-option {
        display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        padding: 0.9rem 0.4rem;
        border-radius: 1rem;
        border: 1.5px solid #e2e8f0;
        background: #f8fafc;
        cursor: pointer;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }
    .fb-rating-option:hover {
        transform: translateY(-4px) scale(1.05);
        border-color: #99e6d3;
        box-shadow: 0 12px 22px -10px rgba(13, 148, 136, 0.3);
    }
    .fb-rating-emoji {
        font-size: 1.6rem;
        filter: grayscale(1) opacity(0.55);
        transition: filter 0.25s ease, transform 0.25s ease;
    }
    .fb-rating-label {
        font-size: 0.68rem;
        font-weight: 800;
        color: #94a3b8;
        transition: color 0.25s ease;
    }
    input.fb-radio { position: absolute; opacity: 0; pointer-events: none; }
    input.fb-radio:checked + .fb-rating-emoji { filter: grayscale(0) opacity(1); transform: scale(1.15); }
    input.fb-radio:checked ~ .fb-rating-label { color: #0d9488; }
    .fb-rating-option:has(input.fb-radio:checked) {
        border-color: #0d9488;
        background: linear-gradient(160deg, #ecfdf5 0%, #ffffff 100%);
        box-shadow: 0 14px 26px -12px rgba(13, 148, 136, 0.35);
    }

    .fb-textarea {
        width: 100%;
        padding: 1rem 1.1rem;
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 1rem;
        outline: none;
        resize: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    }
    .fb-textarea:focus {
        border-color: #0d9488;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
    }

    .fb-submit {
        width: 100%;
        padding: 1.05rem;
        border: none;
        border-radius: 1rem;
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.02em;
        background: linear-gradient(120deg, #0E2A2E 0%, #14524E 55%, #0D9488 140%);
        box-shadow: 0 16px 32px -14px rgba(13, 148, 136, 0.5);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
        cursor: pointer;
    }
    .fb-submit:hover {
        transform: translateY(-3px) scale(1.015);
        box-shadow: 0 22px 42px -16px rgba(13, 148, 136, 0.6);
    }
    .fb-submit:active { transform: scale(0.97); }
</style>

<div class="fb-page">
    <div class="max-w-2xl mx-auto">
        <div class="fb-card">
            <div class="fb-header">
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="fb-header-icon"><i class="fas fa-comment-dots"></i></div>
                        <h1 class="text-3xl font-extrabold text-white">Share Your Feedback</h1>
                    </div>
                    <p style="color:#a7f3d0;">Your insights help us improve CareStance for everyone.</p>
                </div>
            </div>

            <form action="/feedback" method="POST" class="p-8 space-y-7">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-3">How would you rate your
                        experience?</label>
                    <div class="fb-rating-row">
                        <label class="fb-rating-option">
                            <input type="radio" name="rating" value="1" class="fb-radio" required>
                            <span class="fb-rating-emoji">😢</span>
                            <span class="fb-rating-label">Poor</span>
                        </label>
                        <label class="fb-rating-option">
                            <input type="radio" name="rating" value="2" class="fb-radio">
                            <span class="fb-rating-emoji">😕</span>
                            <span class="fb-rating-label">Fair</span>
                        </label>
                        <label class="fb-rating-option">
                            <input type="radio" name="rating" value="3" class="fb-radio">
                            <span class="fb-rating-emoji">😐</span>
                            <span class="fb-rating-label">Good</span>
                        </label>
                        <label class="fb-rating-option">
                            <input type="radio" name="rating" value="4" class="fb-radio">
                            <span class="fb-rating-emoji">😊</span>
                            <span class="fb-rating-label">Very Good</span>
                        </label>
                        <label class="fb-rating-option">
                            <input type="radio" name="rating" value="5" class="fb-radio">
                            <span class="fb-rating-emoji">🤩</span>
                            <span class="fb-rating-label">Excellent</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="content" class="block text-sm font-bold text-slate-700 mb-2">What did you like or
                        what can we improve?</label>
                    <textarea id="content" name="content" rows="5" required class="fb-textarea"
                        placeholder="Tell us about your experience..."></textarea>
                </div>

                <button type="submit" class="fb-submit">
                    Submit Feedback
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
