<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CareStance Bulk Onboarding</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background: #f8fafc; color: #1f2937; }
    .panel { max-width: 820px; margin: auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    textarea { width: 100%; min-height: 220px; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
    input[type="file"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; }
    button { background: #1d4ed8; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; }
    .note { color: #475569; font-size: 13px; }
    .report { margin-top: 14px; padding: 12px; border-radius: 8px; background: #eefbf6; color: #064e3b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Bulk ₹300 Onboarding</h1>
    <p class="note">Creates accounts and assigns the active customised plan directly. Razorpay remains hidden for this path.</p>
    <form method="POST" action="/admin/bulk-onboard" enctype="multipart/form-data">
      <label for="users">Users JSON or CSV Input</label>
      <textarea id="users" name="users" required>[
  {"email": "student1@example.com", "full_name": "Student One", "contact_number": "+91 90000 00001", "role": "student"},
  {"email": "student2@example.com", "full_name": "Student Two", "contact_number": "+91 90000 00002", "role": "student"}
]</textarea>
      <div style="margin-top: 12px;">
        <label for="users_file">Or upload a JSON/CSV file</label>
        <input type="file" id="users_file" name="users_file" accept=".json,.csv,text/csv,application/json">
      </div>
      <div style="margin-top: 12px;">
        <label><input type="checkbox" name="send_credentials" value="true"> Send credentials by email</label>
      </div>
      <div class="report">
        Reporting view: created, skipped duplicates, and failures are returned as a clear summary payload for downstream admin UI reporting.
      </div>
      <div style="margin-top: 20px;">
        <button type="submit">Bulk Onboard</button>
      </div>
    </form>
  </div>
</body>
</html>
